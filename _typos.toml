[default]
# Faroese's code, among the languages that write a decimal comma, in quotes
# only, so that "fo" written for "of" is still found.
extend-ignore-re = ['"fo"']

[default.extend-words]
# The project name, Greek for "beautiful".
omorfos = "omorfos"
# What the PipeWire crate calls the parts of a buffer (`datas_mut`).
datas = "datas"
# What GnuPG calls a key's fingerprint in what it lists, and asks for by.
fpr = "fpr"
# Mesa's driver that draws OpenGL with Vulkan, as its messages name it.
zink = "zink"

[files]
# The time zone database's table of places, as it comes, abbreviations and all.
# And the translations of the programs' words, which are not English and are
# read by those who speak their languages (ADR 79); the English is checked.
# And the record of the built-in theme's looks, which is hashes.
extend-exclude = [
    "Cargo.lock",
    "crates/omorfos-config/src/zone1970.tab",
    "crates/omorfos-config/src/looks.golden",
    "crates/omorfos-i18n/i18n/*",
    "!crates/omorfos-i18n/i18n/en",
]
