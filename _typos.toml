[default.extend-words]
# The project name, Greek for "beautiful".
omorfos = "omorfos"
# What the PipeWire crate calls the parts of a buffer (`datas_mut`).
datas = "datas"
# What GnuPG calls a key's fingerprint in what it lists, and asks for by.
fpr = "fpr"

[files]
# The time zone database's table of places, as it comes, abbreviations and all.
# And the translations of the programs' words, which are not English and are
# read by those who speak their languages (ADR 79); the English is checked.
extend-exclude = [
    "Cargo.lock",
    "crates/omorfos-config/src/zone1970.tab",
    "i18n/*",
    "!i18n/en",
]
