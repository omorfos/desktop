<text x="496.00" y="289.00" fill="#fde047" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="end">16 units tall</text>
<text x="80.00" y="386.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">Leave the box to bring the pointer to the words,</text>
<text x="80.00" y="404.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">as someone reading through a magnifier must,</text>
<text x="80.00" y="422.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">and the words are gone.</text>
<rect x="64.00" y="508.00" width="542.00" height="58.00" rx="10.00" fill="#0c1226" stroke="#2b3a6b" stroke-width="1" />
<text x="78.00" y="531.00" fill="#b8c0de" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13">$ omorfosctl state</text>
<text x="78.00" y="552.00" fill="#ff8a93" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5">workspaces, windows, screens, locked, awake, radios</text>
<circle cx="68.00" cy="587.50" r="4.00" fill="#f8616d"/>
<text x="80.00" y="592.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">Which program: only in a tooltip, only under the pointer</text>
<circle cx="68.00" cy="608.50" r="4.00" fill="#f8616d"/>
<text x="80.00" y="613.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">No key, no row of a menu, no notice when it begins</text>
<circle cx="68.00" cy="629.50" r="4.00" fill="#f8616d"/>
<text x="80.00" y="634.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">The tooltip cannot be pointed at, and does not go at Escape</text>
<circle cx="68.00" cy="650.50" r="4.00" fill="#f8616d"/>
<text x="80.00" y="655.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">The same for the date, a title cut short, what “Awake” does</text>
<circle cx="68.00" cy="671.50" r="4.00" fill="#f8616d"/>
<text x="80.00" y="676.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">WCAG 1.4.13, 2.1.1; and what is private should be told to all</text>
<text x="674.00" y="182.00" fill="#f3f5fb" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14.5" font-weight="600">The top right of a screen being shared</text>
