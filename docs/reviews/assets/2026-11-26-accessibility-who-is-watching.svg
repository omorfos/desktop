<text x="110.80" y="139.50" fill="#f3f5fb" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="17" font-weight="600">Told to a pointer resting on a small box</text>
<rect x="650.00" y="104.00" width="590.00" height="610.00" rx="18.00" fill="#10172f" stroke="#2b3a6b" stroke-width="1" />
