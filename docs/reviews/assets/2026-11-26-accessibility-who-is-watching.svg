<text x="688.00" y="552.00" fill="#a3e635" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5">captured: [{ what: screen, by: Meet, since: "14:02" }, …]</text>
<circle cx="678.00" cy="587.50" r="4.00" fill="#a3e635"/>
<text x="690.00" y="592.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">The mark is a button of 24 by 24 at least, and takes the keyboard</text>
<circle cx="678.00" cy="608.50" r="4.00" fill="#a3e635"/>
<text x="690.00" y="613.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">A press or a key opens the list; each line can be stopped</text>
<circle cx="678.00" cy="629.50" r="4.00" fill="#a3e635"/>
<text x="690.00" y="634.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">The roadmap has the gap: sharing cannot be stopped from the desktop</text>
<circle cx="678.00" cy="650.50" r="4.00" fill="#a3e635"/>
<text x="690.00" y="655.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">The state says it, so the bar and a screen reader can</text>
<circle cx="678.00" cy="671.50" r="4.00" fill="#a3e635"/>
<text x="690.00" y="676.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">A tooltip stays under the pointer, and goes at Escape</text>
