<text x="444.00" y="256.80" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="12">a row of any menu</text>
<text x="444.00" y="274.20" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="12">the launcher’s programs</text>
