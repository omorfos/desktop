<text x="322.00" y="744.00" fill="#ff8a93" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">gives; no Tab, no ring</text>
<text x="64.00" y="768.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">Keep the screens like this?</text>
<text x="322.00" y="768.00" fill="#ff8a93" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">keeps; there are no buttons to press</text>
<text x="64.00" y="792.00" fill="#b8c0de" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">A password</text>
<text x="322.00" y="792.00" fill="#a3e635" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="13">hands it in; Tab and a ring</text>
