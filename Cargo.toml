[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/omorfos/desktop"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicate versions come from Smithay's dependency tree, which we do not
# control. cargo-deny reports them without failing the build.
multiple_crate_versions = "allow"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# For trying a build by hand on real hardware: optimised like a release, but
# compiled in parallel, without link-time optimisation and keeping what did
# not change, so that it is quick to build again. Packages are built with
# `release`.
[profile.quick]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
