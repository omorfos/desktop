[package]
name = "xdg-desktop-portal-omorfos"
description = "What applications ask the desktop through the portals, answered for omorfos"
keywords = ["wayland", "compositor", "portal"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Connects to the compositor, to end when the session does.
omorfos-shell = { path = "../omorfos-shell" }
# Says what the desktop looks like, which applications are told.
omorfos-config = { path = "../omorfos-config" }
# Already in the tree through Smithay. Waits for the bus or the
# configuration to have something to say (`event`), and makes what the
# thread that answers the bus says it is done by (`pipe`).
rustix = { version = "1.1.5", default-features = false, features = ["event", "pipe"] }
# The portals are spoken to over D-Bus. Already in the tree through the
# notifications.
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
