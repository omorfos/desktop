[package]
name = "xdg-desktop-portal-omorfos"
description = "What applications ask the desktop through the portals, answered for omorfos"
keywords = ["wayland", "compositor", "portal"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Connects to the compositor, and hands it the question drawn.
omorfos-shell = { path = "../omorfos-shell" }
# Takes pictures of the screen and saves them as the screenshot tool does.
omorfos-screenshot = { path = "../omorfos-screenshot" }
# Draws the question.
omorfos-ui = { path = "../omorfos-ui" }
# The question is asked on the screen as a Wayland client. All are already
# in the tree through Smithay's nested backend.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# Turns the keys the compositor reports into what they are, by its
# layout. Without its default features it maps nothing into memory.
xkbcommon = { version = "0.8.0", default-features = false }
# Says what the desktop looks like, which applications are told.
omorfos-config = { path = "../omorfos-config" }
# Already in the tree through Smithay. Waits for the bus or the
# configuration to have something to say (`event`), and makes what the
# thread that answers the bus says it is done by (`pipe`).
rustix = { version = "1.1.5", default-features = false, features = ["event", "pipe"] }
# The portals are spoken to over D-Bus. Already in the tree through the
# notifications.
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
