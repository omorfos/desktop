[package]
name = "omorfos-ipc"
description = "The IPC protocol of the omorfos compositor, and a client for it"
keywords = ["wayland", "compositor", "ipc"]
categories = ["api-bindings"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
# Already in the tree through Smithay. Hands a socket from `omorfos-hold` to
# the compositor it starts, without `unsafe` (`net`); and hands what was
# copied to a program that pastes it without waiting on the program: tells
# a pipe from anything else (`fs`), moves what is handed over into it
# through a pipe of our own (`pipe`), and waits by the clock for one with no
# room (`event`); and raises the limit on descriptors of each program of
# the session (`process`).
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "net", "pipe", "process", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
