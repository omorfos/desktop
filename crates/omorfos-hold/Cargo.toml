[package]
name = "omorfos-hold"
description = "Holds an omorfos session while its compositor is started again, so that installing a new version, or a crash, does not end the login"
keywords = ["wayland", "compositor", "session"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# What the holder and the compositor say, and how the socket is handed over.
omorfos-ipc = { path = "../omorfos-ipc" }
# Already in the tree through Smithay. Locks the socket's name as every
# Wayland compositor does (`fs`), waits on and stops the relay by its
# process (`process`), as a version of the holder that takes up another's
# has it as a child but no handle to it, and points the session's output at
# its log (`stdio`).
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std", "stdio"] }
# Already in the tree, as the compositor's. Its libseat session alone: the
# holder keeps the seat while compositors come and go (ADR 63), and Smithay
# owns the descriptors libseat gives out, which the holder has no `unsafe`
# to close. Its event loop waits on the seat and on the compositor at once.
smithay = { version = "0.7.0", default-features = false, features = ["backend_session_libseat"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
