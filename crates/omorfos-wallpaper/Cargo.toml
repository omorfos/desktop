[package]
name = "omorfos-wallpaper"
description = "The wallpaper of the omorfos desktop: a picture or a colour behind the windows of each screen"
keywords = ["wayland", "compositor", "wallpaper"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
omorfos-config = { path = "../omorfos-config" }
omorfos-shell = { path = "../omorfos-shell" }
omorfos-ui = { path = "../omorfos-ui" }
# Already in the tree through the configuration. Hears of pictures put in,
# changed in or taken out of the directories shown from.
inotify = { version = "0.11.5", default-features = false }
# Reads the pictures that are PNG. Already in the tree for icons.
png = "0.18.1"
# Already in the tree through Smithay. Waits on several descriptors at once
# (`event`).
rustix = { version = "1.1.5", default-features = false, features = ["event"] }
# The wallpaper is a Wayland client. All three are already in the tree
# through Smithay's nested backend.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# Reads the pictures that are JPEG, which photographs are. Without its
# default features it uses no instructions particular to a processor, which
# are reached through `unsafe`: slower to read a picture, which happens
# once in minutes, for less unsafe code in reach of a file.
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
