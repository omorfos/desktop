[package]
name = "omorfos-config"
description = "Configuration schema, validation and live reload for the omorfos compositor"
keywords = ["wayland", "compositor", "configuration"]
categories = ["config"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Generates JSON Schemas for the configuration files (editor completion),
# the list of what they promise (ADR 73), and their manual pages.
schema = ["dep:schemars", "dep:serde_json", "dep:omorfos-ipc"]

[dependencies]
inotify = { version = "0.11.5", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["event", "std", "time"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
schemars = { version = "1.2.2", optional = true }
# Already in the tree, under schemars: the schemas are walked as JSON to
# list what they promise.
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# Writes the manual pages, as it does the programs'.
omorfos-ipc = { path = "../omorfos-ipc", optional = true }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
