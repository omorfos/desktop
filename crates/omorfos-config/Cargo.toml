[package]
name = "omorfos-config"
description = "Configuration schema, validation and live reload for the omorfos compositor"
keywords = ["wayland", "compositor", "configuration"]
categories = ["config"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Generates JSON Schemas for the configuration files (editor completion),
# the list of what they promise (ADR 73), and their manual pages.
schema = ["dep:schemars", "dep:serde_json", "dep:omorfos-ipc"]

[dependencies]
inotify = { version = "0.11.5", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["event", "std", "time"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
schemars = { version = "1.2.2", optional = true }
# Already in the tree, under schemars: the schemas are walked as JSON to
# list what they promise.
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# Writes the manual pages, as it does the programs'.
omorfos-ipc = { path = "../omorfos-ipc", optional = true }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
# What serde-saphyr reads YAML with, and already in the tree under it: its
# events say where in the file each key and value is written, so that one
# can be changed with the rest of the file left as it is (ADR 81).
granit-parser = { version = "2.1.0", default-features = false, features = ["std", "error_messages"] }

[dev-dependencies]
# Already in the tree; reads the coverage gate's regular expression in a test.
regex = "1.13.1"
tempfile = "3.27.0"

[lints]
workspace = true
