[package]
name = "omorfos-shell"
description = "What the omorfos shell components share as Wayland clients"
keywords = ["wayland", "compositor", "client"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Says what time it is where the user is, for the clocks of the panel and
# the lock screen.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
omorfos-ui = { path = "../omorfos-ui" }
# Already in the tree through Smithay. Makes the memory a picture is handed
# over in.
rustix = { version = "1.1.5", default-features = false, features = ["fs"] }
# Already in the tree through Smithay's nested backend.
wayland-client = "0.31.15"
# Already in the tree under wayland-client. Its `log` feature has what it
# would otherwise print itself, unsigned, go through `log`, which the
# components install nothing for: what went wrong comes back to them as an
# error all the same, and they say it, with their names, when it matters.
wayland-backend = { version = "0.3.17", features = ["log"] }
# Turns the keys the compositor reports into what they type. Without its
# default features it does not map the layout into memory, which would
# need `unsafe`.
xkbcommon = { version = "0.8.0", default-features = false }

[lints]
workspace = true
