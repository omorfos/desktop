[package]
name = "omorfos-i18n"
description = "The words of the omorfos desktop in the user's language"
keywords = ["wayland", "desktop", "translation"]
categories = ["localization"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Project Fluent's messages (ADR 79): the plural forms of every language,
# by CLDR's rules, and named values, which a test holds each translation
# to English by.
fluent-bundle = "0.16.0"
# Already in the tree under fluent-bundle. Names the language a bundle is
# in, which chooses its plural forms.
unic-langid = "0.9.6"

[dev-dependencies]
# Already in the tree under fluent-bundle: the tests read each file's
# messages, the values they are given and the forms they choose among.
fluent-syntax = "0.12.0"
# Already in the tree under fluent-bundle: the plural forms a language has.
intl_pluralrules = "7.0.2"

[lints]
workspace = true
