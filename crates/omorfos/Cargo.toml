[package]
name = "omorfos"
description = "A lightweight Wayland compositor"
keywords = ["wayland", "compositor", "window-manager"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.deb]
maintainer = "Rafal Proszowski <foss@paroxp.org>"
copyright = "2026, Rafal Proszowski and the omorfos contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
omorfos is a Wayland compositor with tabbed window groups, chained key \
bindings, per-application rules and a small footprint. \
It is configured with YAML files that are reloaded as you save them."""
section = "x11"
priority = "optional"
# EGL and OpenGL ES are loaded at run time, so they are not found by the
# automatic shared-library scan and are listed by hand. The scan asks only
# for a libpipewire with what is linked against, and omorfos needs 1.4
# (docs/adr/0056-pipewire-1.4-and-ubuntu-26.04.md).
depends = "$auto, libegl1, libgles2, libpipewire-0.3-0t64 (>= 1.4)"
# Titles are drawn with whatever fonts are installed; make sure one is. The
# rest are programs omorfos runs or speaks to, and does without if absent:
# the portal service and the GTK backend it leaves files to; `gdbus`, which
# waits at login for omorfos's portal backend; and
# `dbus-update-activation-environment`, which tells D-Bus of the session;
# PipeWire, which a shared screen is streamed through; WirePlumber,
# whose `wpctl` the volume keys set the volume with; and `wl-clipboard`,
# which an editor in a terminal, Neovim among them, copies and pastes
# with, since through X11 it cannot read what Wayland programs copy.
recommends = "foot, fonts-dejavu-core | fonts-noto-core, xwayland, xdg-desktop-portal, xdg-desktop-portal-gtk, libglib2.0-bin, dbus-bin | dbus, pipewire (>= 1.4), wireplumber, wl-clipboard"
assets = [
        ["target/release/omorfos", "usr/bin/", "755"],
    ["target/release/omorfos-hold", "usr/bin/", "755"],
    ["target/release/omorfosctl", "usr/bin/", "755"],
    ["target/release/omorfos-panel", "usr/bin/", "755"],
    ["target/release/omorfos-wallpaper", "usr/bin/", "755"],
    ["target/release/omorfos-lock", "usr/bin/", "755"],
    ["target/release/omorfos-launcher", "usr/bin/", "755"],
    ["target/release/omorfos-notifications", "usr/bin/", "755"],
    ["target/release/omorfos-screenshot", "usr/bin/", "755"],
    ["target/release/omorfos-clipboard", "usr/bin/", "755"],
    ["target/release/omorfos-recording", "usr/bin/", "755"],
    ["target/release/omorfos-session", "usr/bin/", "755"],
    ["target/release/omorfos-ask", "usr/bin/", "755"],
    ["target/release/xdg-desktop-portal-omorfos", "usr/bin/", "755"],
    ["../../packaging/omorfos.portal", "usr/share/xdg-desktop-portal/portals/", "644"],
    # The icon and the wallpapers, drawn by omorfos-brand as omorfos is
    # built, under the licence of the pictures.
    ["target/release/share/icons/**/*", "usr/share/icons/", "644"],
    ["target/release/share/backgrounds/**/*", "usr/share/backgrounds/", "644"],
    ["../../LICENSE-pictures", "usr/share/doc/omorfos/", "644"],
    ["../../packaging/omorfos-portals.conf", "usr/share/xdg-desktop-portal/", "644"],
    ["../../packaging/omorfos-session.target", "usr/lib/systemd/user/", "644"],
    # How the lock screen asks PAM: configuration files, once installed.
    ["../../packaging/pam/omorfos-lock", "etc/pam.d/", "644"],
    ["../../packaging/pam/omorfos-lock-fingerprint", "etc/pam.d/", "644"],
    ["../../packaging/pam/omorfos-lock-key", "etc/pam.d/", "644"],
    ["../../README.md", "usr/share/doc/omorfos/", "644"],
    ["../../docs/CONFIGURATION.md", "usr/share/doc/omorfos/", "644"],
    # The built-in theme, to copy from.
    ["../omorfos-config/src/default.css", "usr/share/doc/omorfos/theme.css", "644"],
    ["../../schemas/*.json", "usr/share/omorfos/schemas/", "644"],
    ["../../packaging/omorfos.desktop", "usr/share/wayland-sessions/", "644"],
]

[dependencies]
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
omorfos-config = { path = "../omorfos-config" }
# Already in the tree through the configuration. Hears of the programs that
# come with omorfos being installed again, to take up their new versions.
inotify = { version = "0.11.5", default-features = false }
omorfos-core = { path = "../omorfos-core" }
# Finds and reads the icons of windows' programs, for the switcher.
omorfos-icons = { path = "../omorfos-icons" }
omorfos-ipc = { path = "../omorfos-ipc" }
omorfos-journal = { path = "../omorfos-journal" }
omorfos-ui = { path = "../omorfos-ui" }
# Already in the tree through Smithay; named here for the `process` feature,
# which lets the event loop be woken when a program we started exits,
# `fs`, which keeps what the watcher of what records says from blocking, and
# `stdio`, which puts what the compositor reads from to nothing once it has
# taken the connection `omorfos-hold` started it with.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "stdio"] }
serde = "1.0.229"
# Reads cursor theme files. Already in the tree through Smithay's winit
# backend.
xcursor = "0.3.11"
# Tells programs written for X11 how dense the screen is, where the X
# server keeps what such programs look up. Smithay brings it in already;
# the tests also use it, to open windows as such a program would.
x11rb = "0.13.2"
# Writes a picture of the screen into memory a program shares.
omorfos-shm = { path = "../omorfos-shm" }
# Already in the tree through Smithay; named here for `libwayland_1_23`,
# which lets the compositor say how much it keeps for a program that is
# not reading. The backend stays the one written in Rust: the feature
# links nothing.
wayland-server = { version = "0.31.14", default-features = false, features = ["libwayland_1_23"] }
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "xwayland",
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_multi",
] }

[dev-dependencies]
# The panel is tested where the compositor is, so that it is tested against
# a real one. It does not depend on the compositor, so nothing goes round.
omorfos-panel = { path = "../omorfos-panel" }
omorfos-wallpaper = { path = "../omorfos-wallpaper" }
omorfos-lock = { path = "../omorfos-lock" }
omorfos-launcher = { path = "../omorfos-launcher" }
omorfos-notifications = { path = "../omorfos-notifications" }
omorfos-screenshot = { path = "../omorfos-screenshot" }
omorfos-clipboard = { path = "../omorfos-clipboard" }
xdg-desktop-portal-omorfos = { path = "../xdg-desktop-portal-omorfos" }
omorfos-session = { path = "../omorfos-session" }
omorfos-ask = { path = "../omorfos-ask" }
# Tells, as the components' programs do, the session ending from a failure.
omorfos-shell = { path = "../omorfos-shell" }
# Reads back the pictures the screenshot tool saves.
png = "0.18.1"
# Sends notifications in the tests, as a program would.
zbus = "5.19.0"
# Reads, as an application would, the screen that is shared.
pipewire = { version = "0.10.1", features = ["v0_3_65"] }
serde_json = "1.0"
# The software renderer lets the tests draw without a GPU. It is enabled here
# only, so the shipped binary does not link pixman.
smithay = { version = "0.7.0", default-features = false, features = ["renderer_pixman"] }
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# The input method's protocols, as an input method speaks them; the
# compositor's side of them comes with Smithay.
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
