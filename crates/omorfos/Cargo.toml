[package]
name = "omorfos"
description = "A lightweight Wayland compositor inspired by Fluxbox"
keywords = ["wayland", "compositor", "window-manager"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.deb]
maintainer = "Rafal Proszowski <foss@paroxp.org>"
copyright = "2026, Rafal Proszowski and the omorfos contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
omorfos is a Wayland compositor in the spirit of Fluxbox: tabbed window \
groups, chained key bindings, per-application rules and a small footprint. \
It is configured with YAML files that are reloaded as you save them."""
section = "x11"
priority = "optional"
# EGL and OpenGL ES are loaded at run time, so they are not found by the
# automatic shared-library scan and are listed by hand.
depends = "$auto, libegl1, libgles2"
# Titles are drawn with whatever fonts are installed; make sure one is.
recommends = "foot, fonts-dejavu-core | fonts-noto-core, xwayland"
assets = [
        ["target/release/omorfos", "usr/bin/", "755"],
    ["target/release/omorfosctl", "usr/bin/", "755"],
    ["target/release/omorfos-panel", "usr/bin/", "755"],
    ["target/release/omorfos-launcher", "usr/bin/", "755"],
    ["target/release/omorfos-notifications", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/omorfos/", "644"],
    ["../../docs/CONFIGURATION.md", "usr/share/doc/omorfos/", "644"],
    # The built-in theme, to copy from.
    ["../omorfos-config/src/default.css", "usr/share/doc/omorfos/theme.css", "644"],
    ["../../schemas/*.json", "usr/share/omorfos/schemas/", "644"],
    ["../../packaging/omorfos.desktop", "usr/share/wayland-sessions/", "644"],
]

[dependencies]
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
omorfos-config = { path = "../omorfos-config" }
omorfos-core = { path = "../omorfos-core" }
omorfos-ipc = { path = "../omorfos-ipc" }
omorfos-ui = { path = "../omorfos-ui" }
# Already in the tree through Smithay; named here for the `process` feature,
# which lets the event loop be woken when a program we started exits.
rustix = { version = "1.1.5", default-features = false, features = ["process"] }
serde = "1.0.229"
# Reads cursor theme files. Already in the tree through Smithay's winit
# backend.
xcursor = "0.3.11"
# Tells programs written for X11 how dense the screen is, where the X
# server keeps what such programs look up. Smithay brings it in already;
# the tests also use it, to open windows as such a program would.
x11rb = "0.13.2"
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "xwayland",
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_multi",
] }

[dev-dependencies]
# The panel is tested where the compositor is, so that it is tested against
# a real one. It does not depend on the compositor, so nothing goes round.
omorfos-panel = { path = "../omorfos-panel" }
omorfos-launcher = { path = "../omorfos-launcher" }
omorfos-notifications = { path = "../omorfos-notifications" }
# Sends notifications in the tests, as a program would.
zbus = "5.19.0"
serde_json = "1.0"
# The software renderer lets the tests draw without a GPU. It is enabled here
# only, so the shipped binary does not link pixman.
smithay = { version = "0.7.0", default-features = false, features = ["renderer_pixman"] }
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
