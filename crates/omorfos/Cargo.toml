[package]
name = "omorfos"
description = "A lightweight Wayland compositor inspired by Fluxbox"
keywords = ["wayland", "compositor", "window-manager"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.deb]
maintainer = "Rafal Proszowski <foss@paroxp.org>"
copyright = "2026, Rafal Proszowski and the omorfos contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
omorfos is a Wayland compositor in the spirit of Fluxbox: tabbed window \
groups, chained key bindings, per-application rules and a small footprint. \
It is configured with YAML files that are reloaded as you save them."""
section = "x11"
priority = "optional"
# EGL and OpenGL ES are loaded at run time, so they are not found by the
# automatic shared-library scan and are listed by hand.
depends = "$auto, libegl1, libgles2"
# Titles are drawn with whatever fonts are installed; make sure one is.
recommends = "foot, fonts-dejavu-core | fonts-noto-core"
assets = [
        ["target/release/omorfos", "usr/bin/", "755"],
    ["target/release/omorfosctl", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/omorfos/", "644"],
    ["../../docs/CONFIGURATION.md", "usr/share/doc/omorfos/", "644"],
    ["../../schemas/*.json", "usr/share/omorfos/schemas/", "644"],
]

[dependencies]
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
omorfos-config = { path = "../omorfos-config" }
omorfos-core = { path = "../omorfos-core" }
omorfos-ipc = { path = "../omorfos-ipc" }
serde = "1.0.229"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "backend_winit"] }

[dev-dependencies]
serde_json = "1.0"
# The software renderer lets the tests draw without a GPU. It is enabled here
# only, so the shipped binary does not link pixman.
smithay = { version = "0.7.0", default-features = false, features = ["renderer_pixman"] }
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
