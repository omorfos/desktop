[package]
name = "omorfos"
description = "A lightweight Wayland compositor inspired by Fluxbox"
keywords = ["wayland", "compositor", "window-manager"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
omorfos-config = { path = "../omorfos-config" }
omorfos-core = { path = "../omorfos-core" }
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "backend_winit"] }

[dev-dependencies]
# The software renderer lets the tests draw without a GPU. It is enabled here
# only, so the shipped binary does not link pixman.
smithay = { version = "0.7.0", default-features = false, features = ["renderer_pixman"] }
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
