[package]
name = "omorfos-session"
description = "What an omorfos session does besides draw: locking before sleep, starting programs at login, the volume, the brightness and what is playing"
keywords = ["wayland", "desktop", "session"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Reads the desktop entries of what is to start with the session.
omorfos-entries = { path = "../omorfos-entries" }
# Hears from the compositor when the session is locked, and asks it to lock.
omorfos-ipc = { path = "../omorfos-ipc" }
omorfos-journal = { path = "../omorfos-journal" }
# What an action is written as, to the compositor.
serde_json = "1.0"
# Already in the tree through the notifications. Speaks to logind, to what
# is playing and to the notifications over D-Bus, in safe Rust.
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
