[package]
name = "omorfos-recording"
description = "Tells the omorfos desktop what records from a microphone or a camera, as PipeWire knows it"
keywords = ["wayland", "compositor", "pipewire"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Already in the tree through the portal. Binds libpipewire, whose graph is
# where what records is to be seen.
pipewire = { version = "0.10.1", features = ["v0_3_65"] }
# Already in the tree through the configuration's watcher. Tells when a
# camera is opened or let go, so that who has one open is looked at only
# then.
inotify = { version = "0.11.5", default-features = false }
# Already in the tree through Smithay. Tells when nobody reads what it
# writes any more (`event`).
rustix = { version = "1.1.5", default-features = false, features = ["event"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
