[package]
name = "omorfos-launcher"
description = "The launcher of the omorfos desktop: type a program's name to start it"
keywords = ["wayland", "compositor", "launcher"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
omorfos-config = { path = "../omorfos-config" }
omorfos-icons = { path = "../omorfos-icons" }
omorfos-ipc = { path = "../omorfos-ipc" }
omorfos-shell = { path = "../omorfos-shell" }
omorfos-ui = { path = "../omorfos-ui" }
# Already in the tree through Smithay. Waits for the compositor to say
# something (`event`).
rustix = { version = "1.1.5", default-features = false, features = ["event"] }
serde_json = "1.0"
# The launcher is a Wayland client. All three are already in the tree
# through Smithay's nested backend.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# Turns the keys the compositor reports into what they type, by the
# keyboard layout it sends. Already in the tree through Smithay. Without
# its default features it does not map the layout into memory, which would
# need `unsafe`.
xkbcommon = { version = "0.8.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
