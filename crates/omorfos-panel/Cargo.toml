[package]
name = "omorfos-panel"
description = "The panel of the omorfos desktop: workspaces and windows along the edge of a screen"
keywords = ["wayland", "compositor", "panel"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
omorfos-config = { path = "../omorfos-config" }
omorfos-ipc = { path = "../omorfos-ipc" }
omorfos-ui = { path = "../omorfos-ui" }
# Already in the tree through Smithay. Waits on several descriptors at once
# (`event`) and makes the memory a picture is handed over in (`fs`).
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs"] }
serde_json = "1.0"
# The panel is a Wayland client. All three are already in the tree through
# Smithay's nested backend.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
