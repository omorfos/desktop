[package]
name = "omorfos-clipboard"
description = "Keeps what is copied in the omorfos desktop after the program it was copied from closes"
keywords = ["wayland", "compositor", "clipboard"]
categories = ["gui"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Reads how long what is copied is kept.
omorfos-config = { path = "../omorfos-config" }
# Takes the connection the compositor hands its components.
omorfos-shell = { path = "../omorfos-shell" }
# The keeper is a Wayland client. Both are already in the tree through
# Smithay's nested backend.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[lints]
workspace = true
