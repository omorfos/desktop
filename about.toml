# What `cargo about` writes into LICENSE-crates as omorfos is packaged: the
# licence of every crate it is built from, with each text once. The
# licences accepted are those deny.toml allows.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# omorfos's own crates are under LICENSE.
private = { ignore = true }
