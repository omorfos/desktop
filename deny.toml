[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
# Vulnerabilities fail everywhere. "Unmaintained" notices fail only for crates
# we depend on directly; ones deep in Smithay's tree are not ours to replace.
unmaintained = "workspace"

[licenses]
# Permissive licences compatible with shipping an MIT binary. Extend only
# after reading the licence; never add a copyleft licence here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
