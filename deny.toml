[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
# Vulnerabilities fail everywhere. "Unmaintained" notices fail only for crates
# we depend on directly; ones deep in Smithay's tree are not ours to replace.
unmaintained = "workspace"

[licenses]
# Permissive licences compatible with shipping an MIT binary. Extend only
# after reading the licence; never add a copyleft licence here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
# Two versions of one crate are built and shipped twice, which an update can
# bring in without anybody noticing: a new one fails, until it is gone or
# listed below with what holds it back. A listing that no longer matches is
# warned of, and is to be taken out.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # Each is the older of two versions, kept by what still asks for it.
    { crate = "annotate-snippets@0.11.5", reason = "bindgen, which builds the bindings to libpipewire" },
    { crate = "calloop@0.13.0", reason = "winit and smithay-client-toolkit, behind Smithay's 0.14" },
    { crate = "font-types@0.11.3", reason = "read-fonts 0.37, for cosmic-text's skrifa and harfrust" },
    { crate = "getrandom@0.3.4", reason = "ahash and rand_core, behind tempfile's 0.4" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38, for winit, calloop 0.13 and drm" },
    { crate = "linux-raw-sys@0.9.4", reason = "drm-sys, which pins its own" },
    { crate = "miniz_oxide@0.8.9", reason = "png, behind the 0.9 that compression elsewhere uses" },
    { crate = "nom@7.1.3", reason = "cexpr, for bindgen, behind libspa's 8" },
    { crate = "read-fonts@0.37.0", reason = "cosmic-text's skrifa and harfrust, behind swash's" },
    { crate = "roxmltree@0.20.0", reason = "fontconfig-parser, behind usvg's 0.21" },
    { crate = "rustix@0.38.44", reason = "winit, calloop 0.13, smithay-client-toolkit and drm" },
    { crate = "shlex@1.3.0", reason = "bindgen, behind cc's 2" },
    { crate = "skrifa@0.40.0", reason = "cosmic-text, behind swash's 0.44" },
    { crate = "smol_str@0.2.2", reason = "winit, behind cosmic-text's 0.3" },
    { crate = "syn@2.0.119", reason = "bindgen and the derives of Smithay's tree, behind serde's 3" },
    { crate = "thiserror@1.0.69", reason = "calloop 0.13, pixman and smithay-client-toolkit" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1, above" },
]
# Path dependencies between our own unpublished crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
