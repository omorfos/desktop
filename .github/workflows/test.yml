name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables are all the coverage gate and a panic's place need. Full
  # debug information made the instrumented tests 9.7 GB, and the amd64
  # runner ran out of disk building them; with line tables they are 5.2 GB.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: Test and coverage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libpipewire-0.3-dev libpam0g-dev libclang-dev clang libpam-wrapper fonts-dejavu-core dbus-daemon xwayland libegl1 pipewire gnupg
      # `libegl1` is for Xwayland, which aborts as it starts without it and
      # does not depend on it. Then where X servers put their sockets, which
      # a session that has never run one does not have.
      - name: Make room for X servers
        run: sudo mkdir -p -m 1777 /tmp/.X11-unix
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # `cargo coverage` is an alias defined in .cargo/config.toml.
      - name: Unit and integration tests with the coverage gate
        run: cargo coverage --locked
      # How much room was left, for the next time it runs short.
      - name: Room left on the disk
        if: ${{ !cancelled() }}
        run: df -h /
      # Doctests cannot be instrumented on stable, so they run separately.
      - name: Doctests
        run: cargo test --workspace --all-features --doc --locked
