name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and coverage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libpipewire-0.3-dev libclang-dev clang fonts-dejavu-core dbus-daemon xwayland libegl1 pipewire
      # `libegl1` is for Xwayland, which aborts as it starts without it and
      # does not depend on it. Then where X servers put their sockets, which
      # a session that has never run one does not have.
      - name: Make room for X servers
        run: sudo mkdir -p -m 1777 /tmp/.X11-unix
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # `cargo coverage` is an alias defined in .cargo/config.toml.
      - name: Unit and integration tests with the coverage gate
        run: cargo coverage --locked
      # Doctests cannot be instrumented on stable, so they run separately.
      - name: Doctests
        run: cargo test --workspace --all-features --doc --locked
