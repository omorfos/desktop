name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables are all the coverage gate and a panic's place need. Full
  # debug information made the instrumented tests 9.7 GB, and the amd64
  # runner ran out of disk building them; with line tables they are 5.2 GB.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: Test and coverage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libpipewire-0.3-dev libpam0g-dev libclang-dev clang libpam-wrapper fonts-dejavu-core dbus-daemon xwayland libegl1 pipewire gnupg foot zenity
      # `libegl1` is for Xwayland, which aborts as it starts without it and
      # does not depend on it. Then where X servers put their sockets, which
      # a session that has never run one does not have.
      - name: Make room for X servers
        run: sudo mkdir -p -m 1777 /tmp/.X11-unix
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-llvm-cov
      # `cargo coverage` is an alias defined in .cargo/config.toml. A run
      # not over in forty minutes, where it takes under ten, is
      # stopped and fails, naming the tests it was still waiting on, which
      # the test harness says of each still running after a minute.
      - name: Unit and integration tests with the coverage gate
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=60 40m cargo coverage --locked 2>&1 | tee run.log || status=$?
          if [ "$status" -ge 124 ] && [ "$status" -le 137 ]; then
            echo "::error::the tests were not over in 40 minutes; still running:"
            { grep "has been running for over" run.log || true; } | sed 's/\x1b\[[0-9;]*m//g' | tail -10
          fi
          exit "$status"
      # Real programs kept through changes of compositor (docs/TESTING.md,
      # "Real programs"), from the build the coverage gate made: foot and a
      # GTK program here, from Ubuntu's archive, and the rest every night,
      # as they come from Mozilla and Flathub. Each is required to be there.
      - name: Real programs through changes of compositor
        env:
          OMORFOS_REAL: required
        run: timeout --kill-after=60 15m cargo llvm-cov --no-report --workspace --all-features --locked --test integration -- --ignored real::foot real::a_gtk
      # How much room was left, for the next time it runs short.
      - name: Room left on the disk
        if: ${{ !cancelled() }}
        run: df -h /
      # Doctests cannot be instrumented on stable, so they run separately.
      - name: Doctests
        run: cargo test --workspace --all-features --doc --locked
