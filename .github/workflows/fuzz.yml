name: Fuzz

# What reads untrusted input is fuzzed, a target for each: the relay's
# reader, which reads what programs send before the compositor does (ADR
# 61), the configuration, and what crosses omorfos's own sockets; for two
# minutes on each change to what they read with, and for an hour every
# night. cargo-fuzz needs a nightly toolchain, which nothing else here
# uses; the project's own is stable.
on:
  push:
    branches: [main]
    paths:
      - "crates/omorfos-relay/**"
      - "crates/omorfos-ipc/**"
      - "crates/omorfos-config/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "crates/omorfos-relay/**"
      - "crates/omorfos-ipc/**"
      - "crates/omorfos-config/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A nightly of a known day, so that a run is the same run again.
  NIGHTLY: nightly-2026-10-01

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      # Each is run whatever another finds.
      fail-fast: false
      matrix:
        target: [messages, configuration, ipc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-fuzz
      - name: Fuzz
        working-directory: fuzz
        env:
          # Longer at night than on a change.
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '3600' || '120' }}
          TARGET: ${{ matrix.target }}
        # For the toolchain's own target: cargo-fuzz otherwise builds for
        # the one it was itself built for, and the one installed is built
        # for musl, whose static libc the sanitizer cannot work with.
        run: |
          host=$(rustc "+$NIGHTLY" -vV | sed -n 's/^host: //p')
          cargo "+$NIGHTLY" fuzz run --target "$host" "$TARGET" -- \
            -max_total_time="$SECONDS_TO_RUN" -rss_limit_mb=2048
      - name: Keep what made it fail
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
