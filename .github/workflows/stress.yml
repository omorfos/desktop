name: Stress

# Every night, the tests many times over and the coverage gate a few times,
# on both architectures, so that what fails only sometimes is seen within a
# day of the change that made it so, rather than on some later push. A
# failure is said in an issue labelled `flaky`, one for each architecture,
# which a later failure adds to. See docs/TESTING.md, "Flaky tests".
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # How many times the whole suite runs, and the coverage gate.
  RUNS: 30
  COVERAGE_RUNS: 3

jobs:
  stress:
    name: Stress (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As the Test workflow has it.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libpipewire-0.3-dev libpam0g-dev libclang-dev clang libpam-wrapper fonts-dejavu-core dbus-daemon xwayland libegl1 pipewire
      - name: Make room for X servers
        run: sudo mkdir -p -m 1777 /tmp/.X11-unix
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Build the tests
        run: cargo test --workspace --all-features --locked --no-run
      - name: The tests, many times over
        run: |
          mkdir -p failed
          failures=0
          # Every binary runs though one before it failed, so that one
          # flake does not hide another; and a binary that crashed, rather
          # than having a test fail, is named.
          for run in $(seq "$RUNS"); do
            if ! cargo test --workspace --all-features --locked --no-fail-fast > run.log 2>&1; then
              failures=$((failures + 1))
              echo "::error::run $run of $RUNS failed"
              grep -E "^test .* FAILED$|panicked at|process didn't exit successfully" run.log | head -40
              mv run.log "failed/tests-$run.log"
            fi
          done
          echo "$failures of $RUNS runs failed"
          echo "tests=$failures of $RUNS runs failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      # The coverage gate builds everything again, instrumented, beside the
      # build the tests above ran from, and the two together are more than
      # an amd64 runner has room for: every coverage run failed for want of
      # disk. The tests have finished with theirs.
      - name: Make room for the coverage build
        if: ${{ !cancelled() }}
        run: |
          cargo clean --profile dev
          df -h /
      # `cargo coverage` is an alias defined in .cargo/config.toml.
      - name: The coverage gate, a few times over
        if: ${{ !cancelled() }}
        run: |
          mkdir -p failed
          failures=0
          for run in $(seq "$COVERAGE_RUNS"); do
            if ! cargo coverage --locked > run.log 2>&1; then
              failures=$((failures + 1))
              echo "::error::coverage run $run of $COVERAGE_RUNS failed"
              grep -E "^test .* FAILED$|panicked at" run.log | head -40
              awk '$1 ~ /\.rs$/ && ($3 != 0 || $6 != 0 || $9 != 0)' run.log
              mv run.log "failed/coverage-$run.log"
            fi
          done
          echo "coverage=$failures of $COVERAGE_RUNS runs failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: Keep the logs of what failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-${{ matrix.arch }}
          path: failed/
          retention-days: 30
      # One open issue for each architecture: a new one if there is none,
      # or a comment on the one there is.
      - name: Say so in an issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          title="Nightly stress fails on $ARCH"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label flaky --state open \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
              --body "It failed again at $GITHUB_SHA: $url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label flaky --title "$title" \
              --body "The nightly stress run at $GITHUB_SHA failed on $ARCH: $url. The logs of each run that failed are kept with it for 30 days."
          fi
