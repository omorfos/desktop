name: Stress

# Every night, the tests many times over and the coverage gate a few times,
# on both architectures, and what touches memory of C's built with
# AddressSanitizer, so that what fails only sometimes is seen within a
# day of the change that made it so, rather than on some later push. A
# failure is said in an issue labelled `flaky`, one for each architecture,
# which a later failure adds to, with the tests that failed and what they
# said, so that the issue can be read without the logs. A job that is cut
# short says so there too. See docs/TESTING.md, "Flaky tests".
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # How many times the whole suite runs, and the coverage gate.
  RUNS: 30
  COVERAGE_RUNS: 3
  # How many times what AddressSanitizer watches runs, and on which
  # nightly toolchain: one of a known day, as the fuzzing has.
  SANITIZED_RUNS: 10
  NIGHTLY: nightly-2026-10-01

jobs:
  stress:
    name: Stress (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Thirty runs alone took 157 minutes on amd64 on 16 November 2026, and
    # the job was cut short at 180 in the middle of the coverage gate; on
    # arm64 it ended with some 13 minutes to spare three nights in a row.
    # Each run has a limit of its own below, which is what stops a test
    # that waits for good.
    timeout-minutes: 300
    permissions:
      contents: read # To check the code out.
      issues: write # To say a failure in an issue.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # As the Test workflow has it.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libpipewire-0.3-dev libpam0g-dev libclang-dev clang libpam-wrapper fonts-dejavu-core dbus-daemon xwayland libegl1 pipewire gnupg foot zenity flatpak
      - name: Make room for X servers
        run: sudo mkdir -p -m 1777 /tmp/.X11-unix
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Build the tests
        run: cargo test --workspace --all-features --locked --no-run
      - name: The tests, many times over
        run: |
          mkdir -p failed
          failures=0
          # Every binary runs though one before it failed, so that one
          # flake does not hide another; and a binary that crashed, rather
          # than having a test fail, is named. A run not over in twenty
          # minutes, where five is slow, is stopped and counted as failed,
          # with the tests it was still waiting on. What failed is kept in
          # `failed/what.txt` for the issue, each panic with what it said,
          # which is on the lines after it.
          for run in $(seq "$RUNS"); do
            status=0
            timeout --kill-after=60 20m \
              cargo test --workspace --all-features --locked --no-fail-fast > run.log 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::error::run $run of $RUNS failed"
              {
                echo "tests, run $run of $RUNS (exit $status):"
                grep -E "^test .* FAILED$|process didn't exit successfully" run.log | head -20
                grep -E "panicked at" -A3 run.log | grep -vE "RUST_BACKTRACE|^--$" | head -40
                if [ "$status" -ge 124 ]; then
                  grep "has been running for over" run.log | tail -5
                fi
              } | sed 's/\x1b\[[0-9;]*m//g' | tee -a failed/what.txt
              mv run.log "failed/tests-$run.log"
            fi
          done
          echo "$failures of $RUNS runs failed"
          echo "tests=$failures of $RUNS runs failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      # Firefox ESR from Mozilla's own repository, its key checked against
      # the fingerprint Mozilla publishes before it is trusted, and kept as
      # `.asc`: apt ignores a key in armour named `.gpg`. Telegram, a Qt
      # program, from Flathub. Ubuntu's own Firefox is a snap.
      - name: Install the real programs
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg -o mozilla.gpg
          fingerprint=$(gpg --show-keys --with-colons mozilla.gpg | awk -F: '/^fpr/ {print $10; exit}')
          test "$fingerprint" = 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3
          sudo install -D -m 0644 mozilla.gpg /etc/apt/keyrings/packages.mozilla.org.asc
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          # Mozilla's index of what is for every architecture is now and
          # then served a moment out of step with its release file, while
          # its mirrors sync, and apt then refuses the whole update, which
          # failed arm64's night on 21 and 22 November: it is fetched again,
          # a minute apart, for as long as five minutes.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update; then
              break
            fi
            test "$attempt" -lt 5
            sleep 60
          done
          sudo apt-get install -y --no-install-recommends firefox-esr
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.telegram.desktop
          # Ubuntu keeps sandboxes such as Flatpak's from namespaces of their
          # own unless a profile of AppArmor's lets them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Real programs kept through changes of compositor, every one of them
      # (docs/TESTING.md, "Real programs"), from the build above.
      - name: Real programs through changes of compositor
        if: ${{ !cancelled() }}
        env:
          OMORFOS_REAL: required
        run: |
          mkdir -p failed
          if ! timeout --kill-after=60 20m \
            cargo test --workspace --all-features --locked --test integration -- --ignored real:: > run.log 2>&1; then
            echo "::error::a real program was not kept through changes of compositor"
            {
              echo "real programs:"
              grep -E "^test .* FAILED$|panicked at" -A3 run.log | head -60
            } | sed 's/\x1b\[[0-9;]*m//g' | tee -a failed/what.txt
            mv run.log failed/real.log
            exit 1
          fi
      # The coverage gate builds everything again, instrumented, beside the
      # build the tests above ran from, and the two together are more than
      # an amd64 runner has room for: every coverage run failed for want of
      # disk. The tests have finished with theirs.
      - name: Make room for the coverage build
        if: ${{ !cancelled() }}
        run: |
          cargo clean --profile dev
          df -h /
      # `cargo coverage` is an alias defined in .cargo/config.toml.
      - name: The coverage gate, a few times over
        if: ${{ !cancelled() }}
        run: |
          mkdir -p failed
          failures=0
          # The first run builds everything, instrumented, which is most of
          # the three quarters of an hour each is given.
          for run in $(seq "$COVERAGE_RUNS"); do
            status=0
            timeout --kill-after=60 45m cargo coverage --locked > run.log 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::error::coverage run $run of $COVERAGE_RUNS failed"
              {
                echo "coverage, run $run of $COVERAGE_RUNS (exit $status):"
                grep -E "^test .* FAILED$" run.log | head -20
                grep -E "panicked at" -A3 run.log | grep -vE "RUST_BACKTRACE|^--$" | head -40
                awk '$1 ~ /\.rs$/ && ($3 != 0 || $6 != 0 || $9 != 0)' run.log
              } | sed 's/\x1b\[[0-9;]*m//g' | tee -a failed/what.txt
              mv run.log "failed/coverage-$run.log"
            fi
          done
          echo "coverage=$failures of $COVERAGE_RUNS runs failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: Keep the logs of what failed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-${{ matrix.arch }}
          path: failed/
          retention-days: 30
      # One open issue for each architecture: a new one if there is none,
      # or a comment on the one there is, with what failed, so that it can
      # be told from the issue which test it was and what it said. A job
      # cut short, as one out of time is, skips what waits for a failure:
      # it is said too, or the night would pass for one with nothing wrong.
      - name: Say so in an issue
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          STATUS: ${{ job.status }}
        run: |
          title="Nightly stress fails on $ARCH"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            if [ "$STATUS" = cancelled ]; then
              echo "The nightly stress run at $GITHUB_SHA was cut short on $ARCH, as one that runs out of time is: $url."
            else
              echo "The nightly stress run at $GITHUB_SHA failed on $ARCH: $url."
            fi
            echo "The logs of each run that failed are kept with it for 30 days."
            if [ -s failed/what.txt ]; then
              printf '\n~~~text\n'
              head -n 150 failed/what.txt | cut -c 1-400
              printf '~~~\n'
            fi
          } > said.md
          cat said.md >> "$GITHUB_STEP_SUMMARY"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label flaky --state open \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file said.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label flaky --title "$title" --body-file said.md
          fi

  # Where `unsafe` and C's memory meet, built with AddressSanitizer, which
  # stops at a write to memory that is not to be written, and says where it
  # was freed: what glibc only notices now and then, at a later allocation
  # in whatever test is running (issue #33). The tests of sharing the screen
  # and of what records, through PipeWire, and of `omorfos-pipewire`,
  # the one crate allowed `unsafe`, and `omorfos-shm`, which writes into
  # memory a program shares. Not the whole suite: under a nightly
  # toolchain the tests are
  # not where the tests that look for our programs beside them look, and
  # waits that are counted run out under the sanitizer with every test at
  # once. Leaks are left out: PipeWire keeps what it sets up for good.
  sanitized:
    name: Sanitized (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read # To check the code out.
      issues: write # To say a failure in an issue.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # As the Test workflow has it.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libpipewire-0.3-dev libpam0g-dev libclang-dev clang libpam-wrapper fonts-dejavu-core dbus-daemon xwayland libegl1 pipewire gnupg foot zenity flatpak
      - name: Make room for X servers
        run: sudo mkdir -p -m 1777 /tmp/.X11-unix
      - name: Install the nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      # Built for the toolchain's own target, named, so that the sanitizer
      # is not given to what runs as the build does, as build scripts.
      - name: Build the tests
        run: |
          host=$(rustc "+$NIGHTLY" -vV | sed -n 's/^host: //p')
          echo "HOST=$host" >> "$GITHUB_ENV"
          cargo "+$NIGHTLY" test --locked --target "$host" --all-features \
            -p omorfos-recording -p omorfos-pipewire -p omorfos-shm --lib --tests --no-run
          cargo "+$NIGHTLY" test --locked --target "$host" --all-features \
            -p omorfos --test integration --no-run
      - name: Sanitized, many times over
        run: |
          mkdir -p failed
          failures=0
          for run in $(seq "$SANITIZED_RUNS"); do
            if ! { timeout --kill-after=60 15m \
                     cargo "+$NIGHTLY" test --locked --target "$HOST" --all-features \
                     -p omorfos-recording -p omorfos-pipewire -p omorfos-shm --lib --tests \
                   && timeout --kill-after=60 15m \
                     cargo "+$NIGHTLY" test --locked --target "$HOST" --all-features \
                     -p omorfos --test integration -- sharing:: portal:: versions::; } \
                 > run.log 2>&1; then
              failures=$((failures + 1))
              echo "::error::sanitized run $run of $SANITIZED_RUNS failed"
              {
                echo "sanitized, run $run of $SANITIZED_RUNS:"
                grep -E "ERROR: AddressSanitizer|^test .* FAILED$|panicked at" -A12 run.log | head -60
              } | sed 's/\x1b\[[0-9;]*m//g' | tee -a failed/what.txt
              mv run.log "failed/sanitized-$run.log"
            fi
          done
          echo "sanitized=$failures of $SANITIZED_RUNS runs failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: Keep the logs of what failed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-sanitized-${{ matrix.arch }}
          path: failed/
          retention-days: 30
      # One open issue for each architecture: a new one if there is none,
      # or a comment on the one there is, with what failed, so that it can
      # be told from the issue which test it was and what it said. A job
      # cut short, as one out of time is, skips what waits for a failure:
      # it is said too, or the night would pass for one with nothing wrong.
      - name: Say so in an issue
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          STATUS: ${{ job.status }}
        run: |
          title="Nightly stress fails on $ARCH"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            if [ "$STATUS" = cancelled ]; then
              echo "The nightly stress run at $GITHUB_SHA was cut short on $ARCH, as one that runs out of time is: $url."
            else
              echo "The nightly stress run at $GITHUB_SHA failed on $ARCH: $url."
            fi
            echo "The logs of each run that failed are kept with it for 30 days."
            if [ -s failed/what.txt ]; then
              printf '\n~~~text\n'
              head -n 150 failed/what.txt | cut -c 1-400
              printf '~~~\n'
            fi
          } > said.md
          cat said.md >> "$GITHUB_STEP_SUMMARY"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label flaky --state open \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file said.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label flaky --title "$title" --body-file said.md
          fi
