# What reads untrusted input fuzzed: the relay's reader (ADR 61), the
# configuration, and what crosses omorfos's own sockets. A workspace of its
# own, outside the project's, as cargo-fuzz needs a nightly toolchain and
# the project is built with a stable one; run as
# `cargo +nightly fuzz run messages`, `configuration` or `ipc`.
[package]
name = "omorfos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# The moment a configuration is loaded at, as the compositor's.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4.10"
omorfos-config = { path = "../crates/omorfos-config" }
omorfos-ipc = { path = "../crates/omorfos-ipc" }
omorfos-relay = { path = "../crates/omorfos-relay" }
# To read an action as the compositor does.
serde = "1.0.229"

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc"
path = "fuzz_targets/ipc.rs"
test = false
doc = false
bench = false

[workspace]
