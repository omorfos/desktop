[alias]
# The coverage gate: 100% of lines, functions and regions. The ignored
# files are listed, with their reasons, in docs/adr/0002-coverage-policy.md.
coverage = [
    "llvm-cov",
    "--workspace",
    "--all-features",
    "--fail-under-lines=100",
    "--fail-under-functions=100",
    "--fail-under-regions=100",
    # So that a shortfall that comes only sometimes, in CI, says where.
    "--show-missing-lines",
    "--ignore-filename-regex=crates/(omorfos/src/(backend/(winit|hardware)|gpu)|omorfos-hold/src/exec|xdg-desktop-portal-omorfos/src/card)\\.rs",
]
